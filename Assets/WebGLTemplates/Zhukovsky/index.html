    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2A324B; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #2A324B; outline: none; }
      #loader { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 38px; background: #2A324B; transition: opacity .45s ease; font-family: sans-serif; }
      #loader svg { width: min(36vw, 320px); height: auto; }
      #bar { width: min(40vw, 360px); height: 6px; border-radius: 3px; background: rgba(255, 246, 234, .14); overflow: hidden; }
      #fill { width: 0; height: 100%; border-radius: 3px; background: #FF8A3D; transition: width .25s ease; }
      #fail { display: none; color: #FFF6EA; opacity: .8; font-size: 16px; max-width: 80vw; text-align: center; }
    </style>
  </head>

      <div id="bar"><div id="fill"></div></div>
      <div id="fail"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#fill");
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = Math.round(100 * progress) + "%";
      }).then(function (unityInstance) {
        fill.style.width = "100%";
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 500);
        canvas.focus();
      }).catch(function (message) {
        var f = document.querySelector("#fail");
        f.textContent = message;
        f.style.display = "block";
      });
    </script>
